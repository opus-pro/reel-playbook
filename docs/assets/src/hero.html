<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body { height:800px; position:relative; background:var(--sky); }
.burst { position:absolute; inset:-400px; background:repeating-conic-gradient(from 0deg at 72% 50%, #6FD2FF 0 9deg, var(--sky) 9deg 18deg); }
.copy { position:absolute; left:70px; top:46px; width:940px; }
.h1 { font-family:'Lilita One',sans-serif; font-size:92px; line-height:1.08; }
.h2 { font-family:'Lilita One',sans-serif; font-size:92px; line-height:1.08; color:var(--yellow); -webkit-text-stroke:12px var(--ink); paint-order:stroke fill; margin-top:10px; }
.brand { margin-top:30px; display:flex; align-items:center; gap:22px; } .brand img { width:92px; height:92px; } .name { display:inline-block; background:var(--ink); color:var(--cream); font-family:'Lilita One',sans-serif; font-size:52px; padding:12px 34px 14px; border-radius:22px; transform:rotate(-1.5deg); }
.tag { margin-top:20px; font-size:36px; font-weight:600; line-height:1.25; width:860px; }
.phone { position:absolute; left:1085px; top:52px; width:390px; height:696px; border:14px solid var(--ink); border-radius:56px; background:var(--ink); overflow:hidden; transform:rotate(5deg); box-shadow:14px 14px 0 rgba(23,19,63,.9); }
.views { position:absolute; left:26px; bottom:112px; background:var(--cream); border:5px solid var(--ink); border-radius:999px; padding:6px 22px; font-family:'Lilita One',sans-serif; font-size:40px; display:flex; gap:12px; align-items:center; }
.eye { width:40px; height:40px; border:5px solid var(--ink); border-radius:50%; position:relative; background:#fff; } .eye:after { content:''; position:absolute; left:9px; top:9px; width:12px; height:12px; border-radius:50%; background:var(--ink); }
.thumb { position:absolute; left:220px; bottom:-30px; width:104px; height:176px; border-radius:60px; background:#E8B48F; border:6px solid var(--ink); }
.star { position:absolute; font-size:64px; color:var(--yellow); -webkit-text-stroke:5px var(--ink); paint-order:stroke fill; }
.ai { position:absolute; left:22px; top:30px; background:var(--cream); border:5px solid var(--ink); border-radius:999px; padding:4px 20px; font-family:'Lilita One',sans-serif; font-size:32px; }
</style></head><body>
<div class="burst"></div>
<div class="copy">
  <div class="h1 outline">Claude made you a great video.</div>
  <div class="h2">So why did nobody watch?</div>
  <div class="brand"><img src="../icon.png" alt=""><div class="name">Reel Runbook</div></div>
  <div class="tag">Free agent skills that fix the topic, the script and the hook of your YouTube Shorts, TikToks and Reels.</div>
</div>
<div class="phone">
  <svg viewBox="0 0 390 696" width="362" height="668" style="display:block">
    <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2A8C"/><stop offset=".55" stop-color="#E0569B"/><stop offset="1" stop-color="#FFB35C"/></linearGradient>
    <radialGradient id="u"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".55" stop-color="#FFD56A"/><stop offset="1" stop-color="#FFD56A" stop-opacity="0"/></radialGradient></defs>
    <rect width="390" height="696" fill="url(#s)"/><circle cx="195" cy="320" r="170" fill="url(#u)"/>
    <path d="M0 470 L95 330 L190 450 L285 310 L390 460 L390 696 L0 696 Z" fill="#2A1A5E"/>
    <path d="M0 570 L120 470 L240 580 L330 490 L390 540 L390 696 L0 696 Z" fill="#130B38"/>
  </svg>
  <div class="ai">AI VIDEO</div>
  <div class="views"><span class="eye"></span>0 views</div>
  <div class="thumb"></div>
</div>
<div class="star" style="left:1010px;top:110px">★</div><div class="star" style="left:1500px;top:90px">★</div><div class="star" style="left:1508px;top:600px;font-size:48px">★</div><div class="star" style="left:1020px;top:640px;font-size:44px">★</div>
</body></html>
